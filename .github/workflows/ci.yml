name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      # Report every Python version even if one fails.
      fail-fast: false
      matrix:
        # 3.13 is what Raspberry Pi OS trixie ships; 3.12 keeps local dev on older Macs working.
        python: ["3.13", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt -e .
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Changelog has an entry for the package version
        run: python scripts/changelog.py check
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -q
