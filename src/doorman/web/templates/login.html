{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block main_class %}page narrow auth{% endblock %}
{% block content %}
<section class="card">
  <h1>Sign in</h1>
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username
      <input name="username" autocomplete="username webauthn" autocapitalize="none" spellcheck="false" required value="{{ username or '' }}">
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn-primary wide">Sign in</button>
  </form>
  <div class="divider"><span>or</span></div>
  <button type="button" class="btn-secondary wide" data-passkey-login data-next="{{ next }}" hidden>Sign in with a passkey</button>
  <p class="hint center" data-no-passkey hidden>This browser doesn't support passkeys.</p>
</section>
{% endblock %}
